    margin:0; background:#FFE9DA; color:var(--text); font-family:var(--font-display);

async function uploadPhoto(file){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `photos/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${path}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'apikey': SUPABASE_KEY,
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if(!res.ok){ throw new Error('upload failed: ' + res.status); }
  return `${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${path}`;
}

// resize + re-encode as JPEG until the file is under maxBytes (default 300KB)
function compressImage(file, maxBytes, maxDim){
  maxBytes = maxBytes || 300 * 1024;
  maxDim = maxDim || 1600;
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        const scale = Math.min(1, maxDim / Math.max(width, height));
        width = Math.max(1, Math.round(width * scale));
        height = Math.max(1, Math.round(height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        let quality = 0.9;
        const tryStep = ()=>{
          canvas.toBlob((blob)=>{
            if(!blob){ resolve(file); return; }
            if(blob.size <= maxBytes || quality <= 0.35){
              resolve(new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' }));
            } else {
              quality -= 0.12;
              tryStep();
            }
          }, 'image/jpeg', quality);
        };
        tryStep();
      };
      img.onerror = ()=> resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = ()=> resolve(file);
    reader.readAsDataURL(file);
  });
}

async function deleteStoragePhoto(photoUrl){
  if(!photoUrl) return;
  try{
    const marker = `/storage/v1/object/public/${SUPABASE_BUCKET}/`;
    const idx = photoUrl.indexOf(marker);
    if(idx === -1) return;
    const path = photoUrl.slice(idx + marker.length);
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ prefixes: [path] })
    });
    if(!res.ok){ console.warn('photo cleanup failed', res.status, await res.text()); }
    else { console.log('photo cleanup ok', await res.text()); }
  }catch(e){ console.error('photo cleanup error', e); }
}

async function load(){

    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${STORAGE_KEY}?t=${Date.now()}`);

async function persist(){

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  shell.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 1800);
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });
}
function monthYearKey(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('th-TH', { year:'numeric', month:'long' });
}

function heartsHtml(rating){
  let h = '';
  for(let i=1;i<=5;i++){ h += i<=rating ? '♥' : '<span class="off">♥</span>'; }
  return `<div class="hearts">${h}</div>`;
}

// real geocoding via OpenStreetMap Nominatim (free, no API key needed)
async function geocodePlace(place){
  try{
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(place));
    const data = await res.json();
    if(data && data[0]){ return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) }; }
  }catch(e){ /* offline or blocked - fall through */ }
  return null;
}

async function ensureCoords(m){
  if(m.lat!=null && m.lng!=null) return;
  const match = memories.find(x=>x.id!==m.id && x.place && x.place.trim().toLowerCase()===m.place.trim().toLowerCase() && x.lat!=null);
  if(match){ m.lat = match.lat; m.lng = match.lng; return; }
  const coords = await geocodePlace(m.place);
  if(coords){ m.lat = coords.lat; m.lng = coords.lng; }
}

  if(tab==='home') renderHome();
  else if(tab==='map') renderMap();
  else if(tab==='timeline') renderTimeline();
  else if(tab==='settings') renderSettings();
  renderSheet();
}

function filteredSorted(){
  const s = searchTerm.trim().toLowerCase();
  let list = [...memories];
  if(s){ list = list.filter(m => (m.place||'').toLowerCase().includes(s) || (m.story||'').toLowerCase().includes(s)); }
  return list.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
}

function renderHome(){
  const list = filteredSorted();
  const places = new Set(memories.map(m=>m.place.trim().toLowerCase())).size;
  view.innerHTML = `
    <input class="search" id="searchInput" placeholder="ค้นหาสถานที่หรือเรื่องราว" value="${escapeAttr(searchTerm)}" />
    ${memories.length ? `<p class="stat-line">เก็บไว้แล้ว ${memories.length} เรื่องราว จาก ${places} สถานที่</p>` : ''}
    <div id="listWrap"></div>
  `;
  const wrap = document.getElementById('listWrap');
  if(!list.length){
    wrap.innerHTML = `<div class="empty">${penguinSVG(90, {heart:true})}<span class="mark">ยังไม่มีความทรงจำเลย~</span>กดปุ่ม + ด้านล่างเพื่อเริ่มเก็บเรื่องแรกกับเพนกวินกันเถอะ 🐧</div>`;
  } else {
    wrap.innerHTML = list.map(rowHtml).join('');
  }
  document.getElementById('searchInput').oninput = (e)=>{ searchTerm = e.target.value; renderHome(); };
  bindRowClicks();
}

function rowHtml(m){
  const photos = photosOf(m);
  const thumb = photos.length
    ? `<div class="memory-thumb" style="position:relative;padding:0;overflow:hidden;"><img src="${escapeAttr(photos[0])}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'"/>${photos.length>1?`<span style="position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-family:var(--font-display);">+${photos.length-1}</span>`:''}</div>`
    : `<div class="memory-thumb">${penguinSVG(34)}</div>`;
  return `
    <div class="memory-row" data-id="${m.id}">
      ${thumb}
      <div class="memory-body">
        <p class="memory-place">${escapeHtml(m.place)}</p>
        <span class="memory-date">${fmtDate(m.date)}</span>
        ${m.story ? `<p class="memory-story">${escapeHtml(m.story)}</p>` : ''}
        ${heartsHtml(m.rating||0)}
      </div>
    </div>`;
}

function bindRowClicks(){
  document.querySelectorAll('.memory-row').forEach(el=>{
    el.onclick = ()=>{ openSheet = { type:'detail', id: el.dataset.id }; renderSheet(); };
  });
}

function renderTimeline(){
  const list = filteredSorted();
  if(!list.length){
    view.innerHTML = `<div class="empty">${penguinSVG(90)}<span class="mark">ยังไม่มีอะไรในไทม์ไลน์เลย</span>เพิ่มความทรงจำแรกเพื่อเริ่มต้นกันนะ</div>`;
    return;
  }
  const groups = {};
  list.forEach(m=>{
    const key = monthYearKey(m.date);
    (groups[key] = groups[key] || []).push(m);
  });
  view.innerHTML = Object.entries(groups).map(([key, items])=>`
    <section>
      <div class="group-title">${key}</div>
      ${items.map(rowHtml).join('')}
    </section>
  `).join('');
  bindRowClicks();
}

function renderMap(){
  const withPlace = memories.filter(m=>m.place);
  const withCoords = withPlace.filter(m=>m.lat!=null && m.lng!=null);
  const noCoords = withPlace.filter(m=>m.lat==null || m.lng==null);
  view.innerHTML = `
    <div class="map-wrap" id="mapWrap"></div>
    <p class="map-note">แผนที่แสดงตำแหน่งจริง ค้นหาพิกัดให้อัตโนมัติจากชื่อสถานที่ตอนบันทึกความทรงจำ</p>
    ${noCoords.length ? `<p class="missing-coords">ยังหาตำแหน่งไม่เจอสำหรับ: ${noCoords.map(m=>`<b>${escapeHtml(m.place)}</b>`).join(', ')} — ลองแก้ชื่อให้ชัดขึ้น เช่น เพิ่มชื่อจังหวัด แล้วบันทึกใหม่อีกครั้ง</p>` : ''}
  `;
  if(!withPlace.length){
    document.getElementById('mapWrap').innerHTML = `<div class="empty" style="padding-top:120px">${penguinSVG(70)}ยังไม่มีสถานที่ให้แสดงบนแผนที่</div>`;
    return;
  }
  requestAnimationFrame(()=>{
    if(leafletMap){ leafletMap.remove(); leafletMap = null; }
    const center = withCoords.length ? [withCoords[0].lat, withCoords[0].lng] : [13.7563, 100.5018];
    leafletMap = L.map('mapWrap', { zoomControl:true }).setView(center, withCoords.length ? 6 : 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd', maxZoom: 19
    }).addTo(leafletMap);
    const pinIcon = L.divIcon({
      html: `<div style="width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid #FF8FAE;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.25);">${penguinSVG(22)}</div>`,
      className: '', iconSize:[36,36], iconAnchor:[18,36]
    });
    const bounds = [];
    withCoords.forEach(m=>{
      const marker = L.marker([m.lat, m.lng], { icon: pinIcon }).addTo(leafletMap);
      marker.bindTooltip(m.place, { direction:'top', offset:[0,-30] });
      marker.on('click', ()=>{ openSheet = { type:'detail', id: m.id }; renderSheet(); });
      bounds.push([m.lat, m.lng]);
    });
    if(bounds.length > 1){ leafletMap.fitBounds(bounds, { padding:[30,30] }); }
  });
}

function renderSettings(){
  view.innerHTML = `
    <div class="settings-row">
      <div>
        <div class="label">ส่งออกข้อมูล</div>
        <div class="desc">ดาวน์โหลดความทรงจำทั้งหมดเป็นไฟล์ JSON</div>
      </div>
      <button class="link-btn" id="exportBtn">ส่งออก</button>
    </div>
    <div class="settings-row">
      <div>
        <div class="label">ล้างข้อมูลทั้งหมด</div>
        <div class="desc">ลบความทรงจำทุกรายการออกจากเครื่องนี้</div>
      </div>
      <button class="link-btn" id="clearBtn" style="color:var(--rose)">ล้างข้อมูล</button>
    </div>
    <div class="settings-row">
      <div>
        <div class="label">เวอร์ชัน</div>
        <div class="desc">V1 🐧 เพิ่มความทรงจำ, แผนที่, ไทม์ไลน์</div>
      </div>
    </div>
  `;
  document.getElementById('exportBtn').onclick = exportData;
  document.getElementById('clearBtn').onclick = clearAll;
}

function exportData(){
  const blob = new Blob([JSON.stringify(memories, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'memories-export.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('ดาวน์โหลดไฟล์แล้ว');
}

async function clearAll(){
  if(!confirm('ลบความทรงจำทั้งหมดจริงไหม? กู้คืนไม่ได้')) return;
  memories.forEach(m=>photosOf(m).forEach(deleteStoragePhoto));
  memories = [];
  await persist();
  render();
  showToast('ล้างข้อมูลแล้ว');
}

function renderSheet(){
  const existing = document.querySelector('.sheet-overlay');
  if(existing) existing.remove();
  if(!openSheet) return;

  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay){ openSheet=null; editingId=null; renderSheet(); } };

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  overlay.appendChild(sheet);
  shell.appendChild(overlay);

  if(openSheet === 'add'){
    const editing = editingId ? memories.find(m=>m.id===editingId) : null;
    sheet.innerHTML = addFormHtml(editing);
    bindAddForm(editing);
  } else if(openSheet.type === 'detail'){
    const m = memories.find(x=>x.id===openSheet.id);
    if(!m){ openSheet=null; return; }
    sheet.innerHTML = detailHtml(m);
    document.body; // no-op
    sheet.querySelector('.editBtn').onclick = ()=>{ editingId = m.id; openSheet='add'; renderSheet(); };
    sheet.querySelector('.deleteBtn').onclick = async ()=>{
      if(!confirm('ลบความทรงจำนี้ไหม?')) return;
      photosOf(m).forEach(deleteStoragePhoto);
      memories = memories.filter(x=>x.id!==m.id);
      await persist();
      openSheet=null; render();
      showToast('ลบแล้ว');
    };
    sheet.querySelector('.closeBtn').onclick = ()=>{ openSheet=null; renderSheet(); };
  }
}

function addFormHtml(m){
  const rating = m ? (m.rating||0) : 0;
  return `
    <h2>${m ? 'แก้ไขความทรงจำ' : 'เพิ่มความทรงจำใหม่'}</h2>
    <div class="field">
      <label>สถานที่</label>
      <input id="f_place" type="text" placeholder="เช่น ดอยอินทนนท์" value="${m?escapeAttr(m.place):''}" />
    </div>
    <div class="field">
      <label>วันที่</label>
      <input id="f_date" type="date" value="${m?m.date:''}" />
    </div>
    <div class="field">
      <label>ตำแหน่งบนแผนที่ (แตะเพื่อปักหมุดเอง ไม่บังคับ)</label>
      <div id="pinMapWrap" style="height:170px;border-radius:16px;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 0 #FFEAF1;"></div>
      <div id="pinStatus" style="font-size:11.5px;color:var(--muted);margin-top:6px;">${m&&m.lat!=null ? 'ปักหมุดไว้แล้ว 🐧 แตะบนแผนที่เพื่อเปลี่ยนตำแหน่ง' : 'ยังไม่ได้ปักหมุด ถ้าไม่ปัก ระบบจะค้นหาตำแหน่งให้อัตโนมัติจากชื่อสถานที่'}</div>
    </div>
    <div class="field">
      <label>รูปภาพ (เลือกได้หลายรูป)</label>
      <input id="f_photo_file" type="file" accept="image/*" multiple />
      <div id="photoStrip" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;"></div>
    </div>
    <div class="field">
      <label>เรื่องราว</label>
      <textarea id="f_story" placeholder="วันนั้นเป็นยังไงบ้าง...">${m?escapeHtml(m.story||''):''}</textarea>
    </div>
    <div class="field">
      <label>ความรู้สึก</label>
      <div class="rating-picker" id="ratingPicker">
        ${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}" class="${i<=rating?'filled':''}">♥</button>`).join('')}
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelBtn">ยกเลิก</button>
      <button class="btn primary" id="saveBtn">บันทึก</button>
    </div>
  `;
}

function bindAddForm(existing){
  let rating = existing ? (existing.rating||0) : 0;
  let keptPhotos = existing ? photosOf(existing).slice() : []; // already-uploaded URLs kept
  let removedPhotos = []; // already-uploaded URLs to delete from storage on save
  let newFiles = []; // File objects staged for upload on save

  function renderPhotoStrip(){
    const strip = document.getElementById('photoStrip');
    if(!strip) return;
    let html = '';
    keptPhotos.forEach((url, i)=>{
      html += `<div class="photo-chip"><img src="${escapeAttr(url)}"/><button type="button" class="rm" data-kind="kept" data-i="${i}">✕</button></div>`;
    });
    newFiles.forEach((file, i)=>{
      html += `<div class="photo-chip"><img src="${URL.createObjectURL(file)}"/><span class="pending">ใหม่</span><button type="button" class="rm" data-kind="new" data-i="${i}">✕</button></div>`;
    });
    strip.innerHTML = html;
    strip.querySelectorAll('.rm').forEach(btn=>{
      btn.onclick = ()=>{
        const i = Number(btn.dataset.i);
        if(btn.dataset.kind === 'kept'){ removedPhotos.push(keptPhotos[i]); keptPhotos.splice(i,1); }
        else{ newFiles.splice(i,1); }
        renderPhotoStrip();
      };
    });
  }
  renderPhotoStrip();
  let pinLat = existing && existing.lat!=null ? existing.lat : null;
  let pinLng = existing && existing.lng!=null ? existing.lng : null;
  let pinMap = null;
  let pinMarker = null;
  const pinIcon = L.divIcon({
    html: `<div style="width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #FF8FAE;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.2);">${penguinSVG(20)}</div>`,
    className: '', iconSize:[32,32], iconAnchor:[16,32]
  });
  function updatePinStatus(){
    const el = document.getElementById('pinStatus');
    if(el) el.textContent = 'ปักหมุดไว้แล้ว 🐧 แตะบนแผนที่เพื่อเปลี่ยนตำแหน่ง';
  }
  requestAnimationFrame(()=>{
    const wrap = document.getElementById('pinMapWrap');
    if(!wrap) return;
    const center = (pinLat!=null && pinLng!=null) ? [pinLat, pinLng] : [13.7563, 100.5018];
    pinMap = L.map('pinMapWrap', { zoomControl:false, attributionControl:false }).setView(center, (pinLat!=null)?12:5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:19 }).addTo(pinMap);
    if(pinLat!=null && pinLng!=null){
      pinMarker = L.marker([pinLat, pinLng], { draggable:true, icon:pinIcon }).addTo(pinMap);
      pinMarker.on('dragend', ()=>{ const ll = pinMarker.getLatLng(); pinLat=ll.lat; pinLng=ll.lng; updatePinStatus(); });
    }
    pinMap.on('click', (e)=>{
      pinLat = e.latlng.lat; pinLng = e.latlng.lng;
      if(pinMarker){ pinMarker.setLatLng(e.latlng); }
      else{
        pinMarker = L.marker(e.latlng, { draggable:true, icon:pinIcon }).addTo(pinMap);
        pinMarker.on('dragend', ()=>{ const ll = pinMarker.getLatLng(); pinLat=ll.lat; pinLng=ll.lng; updatePinStatus(); });
      }
      updatePinStatus();
    });
  });
  const picker = document.getElementById('ratingPicker');
  picker.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      rating = Number(btn.dataset.v);
      picker.querySelectorAll('button').forEach(b=>b.classList.toggle('filled', Number(b.dataset.v)<=rating));
    };
  });
  document.getElementById('f_photo_file').onchange = (e)=>{
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    newFiles = newFiles.concat(files);
    e.target.value = '';
    renderPhotoStrip();
  };
  document.getElementById('cancelBtn').onclick = ()=>{ openSheet=null; editingId=null; renderSheet(); };
  document.getElementById('saveBtn').onclick = async ()=>{
    const place = document.getElementById('f_place').value.trim();
    const date = document.getElementById('f_date').value;
    if(!place || !date){ showToast('กรอกสถานที่และวันที่ก่อนนะ'); return; }
    const story = document.getElementById('f_story').value.trim();
    const saveBtn = document.getElementById('saveBtn');

    for(let i=0; i<newFiles.length; i++){
      saveBtn.textContent = `กำลังบีบอัดรูป ${i+1}/${newFiles.length}...`;
      const compressed = await compressImage(newFiles[i], 300*1024, 1600);
      saveBtn.textContent = `กำลังอัปโหลดรูป ${i+1}/${newFiles.length}...`;
      try{
        const url = await uploadPhoto(compressed);
        keptPhotos.push(url);
      }catch(e){
        showToast(`อัปโหลดรูปที่ ${i+1} ไม่สำเร็จ ลองใหม่อีกครั้ง`);
        saveBtn.textContent = 'บันทึก';
        return;
      }
    }
    removedPhotos.forEach(deleteStoragePhoto);
    const photos = keptPhotos;

    saveBtn.textContent = 'กำลังบันทึก...';
    let record;
    if(existing){
      const placeChanged = existing.place.trim().toLowerCase() !== place.trim().toLowerCase();
      Object.assign(existing, { place, date, photos, photoUrl: undefined, story, rating });
      if(pinLat!=null && pinLng!=null){ existing.lat = pinLat; existing.lng = pinLng; }
      else if(placeChanged){ existing.lat = null; existing.lng = null; }
      record = existing;
    } else {
      record = { id: uid(), place, date, photos, story, rating, lat: pinLat, lng: pinLng };
      memories.push(record);
    }
    if(record.lat == null || record.lng == null){ await ensureCoords(record); }
    await persist();
    openSheet=null; editingId=null;
    render();
    showToast('บันทึกความทรงจำแล้ว');
  };
}

function detailHtml(m){
  const photos = photosOf(m);
  const gallery = photos.length
    ? (photos.length > 1
        ? `<div class="detail-gallery">${photos.map(p=>`<img src="${escapeAttr(p)}" onerror="this.style.display='none'"/>`).join('')}</div><div class="detail-gallery-count">เลื่อนดูได้ • ${photos.length} รูป</div>`
        : `<img class="detail-photo" src="${escapeAttr(photos[0])}" onerror="this.style.display='none'"/>`)
    : '';
  return `
    ${gallery}
    <p class="detail-place">${escapeHtml(m.place)}</p>
    <p class="detail-date">${fmtDate(m.date)}</p>
    ${heartsHtml(m.rating||0)}
    ${m.story ? `<p class="detail-story">${escapeHtml(m.story)}</p>` : '<p class="detail-story" style="color:var(--muted)">ยังไม่ได้เขียนเรื่องราวไว้</p>'}
    <div class="sheet-actions">
      <button class="btn ghost closeBtn">ปิด</button>
      <button class="btn ghost editBtn">แก้ไข</button>
      <button class="btn danger deleteBtn">ลบ</button>
    </div>
  `;
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = ()=>{ tab = btn.dataset.tab; searchTerm=''; render(); };
});
document.getElementById('fabAdd').onclick = ()=>{ editingId=null; openSheet='add'; renderSheet(); };

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline caching just won't be available */ });
  });
}

load();
</script>
</body>
</html>
