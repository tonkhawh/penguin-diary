async function uploadPhoto(file){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `photos/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${path}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'apikey': SUPABASE_KEY,
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if(!res.ok){ throw new Error('upload failed: ' + res.status); }
  return `${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${path}`;
}

// resize + re-encode as JPEG until the file is under maxBytes (default 300KB)
function compressImage(file, maxBytes, maxDim){
  maxBytes = maxBytes || 300 * 1024;
  maxDim = maxDim || 1600;
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        const scale = Math.min(1, maxDim / Math.max(width, height));
        width = Math.max(1, Math.round(width * scale));
        height = Math.max(1, Math.round(height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        let quality = 0.9;
        const tryStep = ()=>{
          canvas.toBlob((blob)=>{
            if(!blob){ resolve(file); return; }
            if(blob.size <= maxBytes || quality <= 0.35){
              resolve(new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' }));
            } else {
              quality -= 0.12;
              tryStep();
            }
          }, 'image/jpeg', quality);
        };
        tryStep();
      };
      img.onerror = ()=> resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = ()=> resolve(file);
    reader.readAsDataURL(file);
  });
}

async function deleteStoragePhoto(photoUrl){
  if(!photoUrl) return;
  try{
    const marker = `/storage/v1/object/public/${SUPABASE_BUCKET}/`;
    const idx = photoUrl.indexOf(marker);
    if(idx === -1) return;
    const path = photoUrl.slice(idx + marker.length);
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ prefixes: [path] })
    });
    if(!res.ok){ console.warn('photo cleanup failed', res.status, await res.text()); }
    else { console.log('photo cleanup ok', await res.text()); }
  }catch(e){ console.error('photo cleanup error', e); }
}

const shell = document.getElementById('shell');

function getStringFromDataView(view, offset, length){
  let s = '';
  for(let i=0;i<length;i++){ s += String.fromCharCode(view.getUint8(offset+i)); }
  return s;
}

function readTagValue(view, tiffStart, entryOffset, little){
  const type = view.getUint16(entryOffset+2, little);
  const count = view.getUint32(entryOffset+4, little);
  const typeSizes = {1:1,2:1,3:2,4:4,5:8};
  const size = (typeSizes[type]||4) * count;
  const valueOffset = size <= 4 ? entryOffset+8 : tiffStart + view.getUint32(entryOffset+8, little);
  if(type === 2){
    let s = '';
    for(let i=0;i<count-1;i++){ s += String.fromCharCode(view.getUint8(valueOffset+i)); }
    return s;
  }
  if(type === 3){ return view.getUint16(valueOffset, little); }
  if(type === 4){ return view.getUint32(valueOffset, little); }
  if(type === 5){
    const vals = [];
    for(let i=0;i<count;i++){
      const num = view.getUint32(valueOffset + i*8, little);
      const den = view.getUint32(valueOffset + i*8 + 4, little);
      vals.push(den ? num/den : 0);
    }
    return count === 1 ? vals[0] : vals;
  }
  return null;
}

function readIFD(view, tiffStart, ifdOffset, little){
  const numEntries = view.getUint16(ifdOffset, little);
  const tags = {};
  for(let i=0;i<numEntries;i++){
    const entryOffset = ifdOffset + 2 + i*12;
    const tag = view.getUint16(entryOffset, little);
    tags[tag] = readTagValue(view, tiffStart, entryOffset, little);
  }
  return tags;
}

function dmsToDecimal(dms, ref){
  if(!Array.isArray(dms) || dms.length<3) return null;
  let dec = dms[0] + dms[1]/60 + dms[2]/3600;
  if(ref === 'S' || ref === 'W') dec = -dec;
  return dec;
}

// best-effort EXIF read: pulls DateTimeOriginal + GPS coords out of a JPEG, or resolves null
function readExif(file){
  return new Promise((resolve)=>{
    if(file.type !== 'image/jpeg' && !/\.jpe?g$/i.test(file.name)){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const view = new DataView(e.target.result);
        if(view.getUint16(0, false) !== 0xFFD8){ resolve(null); return; }
        let offset = 2;
        while(offset < view.byteLength - 2){
          const marker = view.getUint16(offset, false);
          if(marker === 0xFFE1){
            const exifStart = offset + 4;
            if(getStringFromDataView(view, exifStart, 4) !== 'Exif'){ resolve(null); return; }
            const tiffStart = exifStart + 6;
            const little = view.getUint16(tiffStart, false) === 0x4949;
            const ifd0Offset = tiffStart + view.getUint32(tiffStart+4, little);
            const ifd0 = readIFD(view, tiffStart, ifd0Offset, little);
            let dateOut = null, lat = null, lng = null;
            if(ifd0[0x8769]!=null){
              const exifIFD = readIFD(view, tiffStart, tiffStart+ifd0[0x8769], little);
              if(exifIFD[0x9003]){
                const dm = String(exifIFD[0x9003]).match(/^(\d{4}):(\d{2}):(\d{2})/);
                if(dm) dateOut = `${dm[1]}-${dm[2]}-${dm[3]}`;
              }
            }
            if(!dateOut && ifd0[0x0132]){
              const dm = String(ifd0[0x0132]).match(/^(\d{4}):(\d{2}):(\d{2})/);
              if(dm) dateOut = `${dm[1]}-${dm[2]}-${dm[3]}`;
            }
            if(ifd0[0x8825]!=null){
              const gpsIFD = readIFD(view, tiffStart, tiffStart+ifd0[0x8825], little);
              lat = dmsToDecimal(gpsIFD[2], gpsIFD[1]);
              lng = dmsToDecimal(gpsIFD[4], gpsIFD[3]);
            }
            resolve({ date: dateOut, lat, lng });
            return;
          } else if((marker & 0xFF00) !== 0xFF00){
            break;
          } else {
            offset += 2 + view.getUint16(offset+2, false);
          }
        }
        resolve(null);
      }catch(err){ resolve(null); }
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsArrayBuffer(file.slice(0, 128*1024));
  });
}

function fmtDate(iso){

// real geocoding via OpenStreetMap Nominatim (free, no API key needed)
async function geocodePlace(place){
  try{
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(place));
    const data = await res.json();
    if(data && data[0]){ return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) }; }
  }catch(e){ /* offline or blocked - fall through */ }
  return null;
}

async function ensureCoords(m){
  if(m.lat!=null && m.lng!=null) return;
  const match = memories.find(x=>x.id!==m.id && x.place && x.place.trim().toLowerCase()===m.place.trim().toLowerCase() && x.lat!=null);
  if(match){ m.lat = match.lat; m.lng = match.lng; return; }
  const coords = await geocodePlace(m.place);
  if(coords){ m.lat = coords.lat; m.lng = coords.lng; }
}

function getOnThisDay(){
  const today = new Date();
  const mm = today.getMonth(), dd = today.getDate(), yy = today.getFullYear();
  return memories
    .filter(m=>{
      if(!m.date) return false;
      const d = new Date(m.date + 'T00:00:00');
      return d.getMonth()===mm && d.getDate()===dd && d.getFullYear() < yy;
    })
    .sort((a,b)=> b.date.localeCompare(a.date));
}

function renderMap(){
  const withPlace = memories.filter(m=>m.place);
  const withCoords = withPlace.filter(m=>m.lat!=null && m.lng!=null);
  const noCoords = withPlace.filter(m=>m.lat==null || m.lng==null);
  view.innerHTML = `
    <div class="map-wrap" id="mapWrap"></div>
    <p class="map-note">แผนที่แสดงตำแหน่งจริง ค้นหาพิกัดให้อัตโนมัติจากชื่อสถานที่ตอนบันทึกความทรงจำ</p>
    ${noCoords.length ? `<p class="missing-coords">ยังหาตำแหน่งไม่เจอสำหรับ: ${noCoords.map(m=>`<b>${escapeHtml(m.place)}</b>`).join(', ')} — ลองแก้ชื่อให้ชัดขึ้น เช่น เพิ่มชื่อจังหวัด แล้วบันทึกใหม่อีกครั้ง</p>` : ''}
  `;
  if(!withPlace.length){
    document.getElementById('mapWrap').innerHTML = `<div class="empty" style="padding-top:120px">${penguinSVG(70)}ยังไม่มีสถานที่ให้แสดงบนแผนที่</div>`;
    return;
  }
  requestAnimationFrame(()=>{
    if(leafletMap){ leafletMap.remove(); leafletMap = null; }
    const center = withCoords.length ? [withCoords[0].lat, withCoords[0].lng] : [13.7563, 100.5018];
    leafletMap = L.map('mapWrap', { zoomControl:true }).setView(center, withCoords.length ? 6 : 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd', maxZoom: 19
    }).addTo(leafletMap);
    const pinIcon = L.divIcon({
      html: `<div style="width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid #FF8FAE;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.25);">${penguinSVG(22)}</div>`,
      className: '', iconSize:[36,36], iconAnchor:[18,36]
    });
    const bounds = [];
    withCoords.forEach(m=>{
      const marker = L.marker([m.lat, m.lng], { icon: pinIcon }).addTo(leafletMap);
      marker.bindTooltip(m.place, { direction:'top', offset:[0,-30] });
      marker.on('click', ()=>{ openSheet = { type:'detail', id: m.id }; renderSheet(); });
      bounds.push([m.lat, m.lng]);
    });
    const chrono = withCoords.slice().sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    if(chrono.length > 1){
      L.polyline(chrono.map(m=>[m.lat, m.lng]), { color:'#FF8FAE', weight:3, dashArray:'2,10', lineCap:'round', opacity:0.75 }).addTo(leafletMap);
    }
    if(bounds.length > 1){ leafletMap.fitBounds(bounds, { padding:[30,30] }); }
  });
}

function computeStats(){
  if(!memories.length) return null;
  const places = {}, months = {};
  let totalRating = 0, ratedCount = 0, minDate = null, maxDate = null;
  memories.forEach(m=>{
    const p = (m.place||'').trim();
    if(p) places[p] = (places[p]||0)+1;
    if(m.date){
      const mk = m.date.slice(0,7);
      months[mk] = (months[mk]||0)+1;
      if(!minDate || m.date < minDate) minDate = m.date;
      if(!maxDate || m.date > maxDate) maxDate = m.date;
    }
    if(m.rating){ totalRating += m.rating; ratedCount++; }
  });
  const topPlace = Object.entries(places).sort((a,b)=>b[1]-a[1])[0];
  const topMonth = Object.entries(months).sort((a,b)=>b[1]-a[1])[0];
  const tripSet = new Set(memories.filter(m=>m.trip).map(m=>m.trip));
  return {
    total: memories.length,
    uniquePlaces: Object.keys(places).length,
    topPlace: topPlace ? topPlace[0] : null,
    topPlaceCount: topPlace ? topPlace[1] : 0,
    topMonthLabel: topMonth ? monthYearKey(topMonth[0]+'-01') : null,
    topMonthCount: topMonth ? topMonth[1] : 0,
    avgRating: ratedCount ? (totalRating/ratedCount).toFixed(1) : null,
    firstDate: minDate,
    tripCount: tripSet.size
  };
}

    const years = availableWrappedYears();
    if(!years.length){ showToast('ยังไม่มีความทรงจำให้สรุปเลย'); return; }
    openSheet = { type:'wrapped', year: years[0] };
    renderSheet();
  };
}

function exportData(){
  const blob = new Blob([JSON.stringify(memories, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'memories-export.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('ดาวน์โหลดไฟล์แล้ว');
}

async function clearAll(){
  if(!confirm('ลบความทรงจำทั้งหมดจริงไหม? กู้คืนไม่ได้')) return;
  memories.forEach(m=>photosOf(m).forEach(deleteStoragePhoto));
  memories = [];
  await persist();
  render();
  showToast('ล้างข้อมูลแล้ว');
}

function renderSheet(){
  const existing = document.querySelector('.sheet-overlay');
  if(existing) existing.remove();
  if(!openSheet) return;

  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay){ openSheet=null; editingId=null; renderSheet(); } };

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  overlay.appendChild(sheet);
  shell.appendChild(overlay);

  if(openSheet === 'add'){
    const editing = editingId ? memories.find(m=>m.id===editingId) : null;
    sheet.innerHTML = addFormHtml(editing);
    bindAddForm(editing);
  } else if(openSheet.type === 'detail'){
    const m = memories.find(x=>x.id===openSheet.id);
    if(!m){ openSheet=null; return; }
    sheet.innerHTML = detailHtml(m);
    document.body; // no-op
    sheet.querySelector('.editBtn').onclick = ()=>{ editingId = m.id; openSheet='add'; renderSheet(); };
    sheet.querySelector('.deleteBtn').onclick = async ()=>{
      if(!confirm('ลบความทรงจำนี้ไหม?')) return;
      photosOf(m).forEach(deleteStoragePhoto);
      memories = memories.filter(x=>x.id!==m.id);
      await persist();
      openSheet=null; render();
      showToast('ลบแล้ว');
    };
    sheet.querySelector('.closeBtn').onclick = ()=>{ openSheet=null; renderSheet(); };
    sheet.querySelectorAll('.gallery-img').forEach(img=>{
      img.onclick = ()=> openLightbox(photosOf(m), Number(img.dataset.idx));
    });
    sheet.querySelectorAll('.theme-swatch').forEach(btn=>{
      btn.onclick = ()=>{ cardTheme = btn.dataset.theme; renderSheet(); };
    });
    sheet.querySelector('.shareCardBtn').onclick = async ()=>{
      const btn = sheet.querySelector('.shareCardBtn');
      const original = btn.textContent;
      btn.textContent = 'กำลังสร้างการ์ด...';
      try{
        await generateShareCard(m);
        showToast('การ์ดพร้อมแล้ว 🐧');
      }catch(e){
        console.error('share card failed', e);
        if(photosOf(m).length){
          try{
            await generateShareCard(m, { skipPhoto:true });
            showToast('สร้างการ์ดแบบไม่มีรูปแทน (รูปนี้แชร์ไม่ได้) 🐧');
          }catch(e2){
            console.error('share card retry failed', e2);
            showToast('สร้างการ์ดไม่สำเร็จ ลองใหม่อีกครั้ง');
          }
        } else {
          showToast('สร้างการ์ดไม่สำเร็จ ลองใหม่อีกครั้ง');
        }
      }
      btn.textContent = original;
    };
  } else if(openSheet.type === 'wrapped'){
    sheet.innerHTML = wrappedHtml(openSheet.year);
    bindWrapped(openSheet.year);
  }
}

function openLightbox(photos, index){
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  let i = index;
  function draw(){
    overlay.innerHTML = `
      <img src="${escapeAttr(photos[i])}"/>
      <button class="lightbox-close">✕</button>
      ${photos.length>1?`<button class="lightbox-nav prev">‹</button><button class="lightbox-nav next">›</button>`:''}
    `;
    overlay.querySelector('.lightbox-close').onclick = (e)=>{ e.stopPropagation(); overlay.remove(); };
    if(photos.length>1){
      overlay.querySelector('.prev').onclick = (e)=>{ e.stopPropagation(); i=(i-1+photos.length)%photos.length; draw(); };
      overlay.querySelector('.next').onclick = (e)=>{ e.stopPropagation(); i=(i+1)%photos.length; draw(); };
    }
  }
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  draw();
  shell.appendChild(overlay);
}

function computeWrapped(year){
  const items = memories.filter(m=>m.date && m.date.slice(0,4)===String(year));
  if(!items.length) return null;
  const places = {};
  items.forEach(m=>{ const p=(m.place||'').trim(); if(p) places[p]=(places[p]||0)+1; });
  const topPlace = Object.entries(places).sort((a,b)=>b[1]-a[1])[0];
  const months = {};
  items.forEach(m=>{ const mk=m.date.slice(5,7); months[mk]=(months[mk]||0)+1; });
  const topMonth = Object.entries(months).sort((a,b)=>b[1]-a[1])[0];
  const topRated = items.slice().sort((a,b)=>(b.rating||0)-(a.rating||0))[0];
  const trips = new Set(items.filter(m=>m.trip).map(m=>m.trip));
  return {
    year, total: items.length, places: Object.keys(places).length,
    topPlace: topPlace ? topPlace[0] : null, topPlaceCount: topPlace ? topPlace[1] : 0,
    topMonthLabel: topMonth ? new Date(Number(year), Number(topMonth[0])-1, 1).toLocaleDateString('th-TH',{month:'long'}) : null,
    tripCount: trips.size, topRated: (topRated && topRated.rating) ? topRated : null
  };
}

function wrappedHtml(year){
  const years = availableWrappedYears();
  const idx = years.indexOf(String(year));
  const hasPrev = idx < years.length-1;
  const hasNext = idx > 0;
  const data = computeWrapped(year);
  const navRow = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <button type="button" class="wrappedNav" data-dir="prev" ${hasPrev?'':'disabled'} style="opacity:${hasPrev?1:0.3};background:none;border:none;font-size:24px;color:#8A5B68;padding:6px 10px;">‹</button>
      <h2 style="font-family:var(--font-display);font-weight:800;color:#8A5B68;margin:0;font-size:17px;">สรุปประจำปี ${year}</h2>
      <button type="button" class="wrappedNav" data-dir="next" ${hasNext?'':'disabled'} style="opacity:${hasNext?1:0.3};background:none;border:none;font-size:24px;color:#8A5B68;padding:6px 10px;">›</button>
    </div>`;
  if(!data){
    return `${navRow}<div class="empty">${penguinSVG(90)}<span class="mark">ปี ${year} ยังไม่มีความทรงจำเลย</span></div>
      <div class="sheet-actions"><button class="btn ghost closeWrappedBtn">ปิด</button></div>`;
  }
  const slides = [
    `<div class="wrapped-slide">${penguinSVG(140,{heart:true})}<h2>สรุปปี ${year}</h2><p>คุณเก็บความทรงจำไว้ทั้งหมด<br/><b style="color:#FF6F91;font-size:26px;">${data.total}</b> เรื่องราว 🐧</p></div>`,
    `<div class="wrapped-slide">${penguinSVG(120)}<h2>ไปมาแล้ว ${data.places} สถานที่</h2>${data.topPlace?`<p>ที่ไปบ่อยที่สุดคือ<br/><b style="color:#8A5B68;">${escapeHtml(data.topPlace)}</b> (${data.topPlaceCount} ครั้ง)</p>`:''}</div>`,
    data.topMonthLabel ? `<div class="wrapped-slide">${penguinSVG(120)}<h2>เดือนที่คึกคักที่สุด</h2><p style="font-size:19px;color:#8A5B68;font-weight:700;">${data.topMonthLabel}</p></div>` : '',
    data.topRated ? `<div class="wrapped-slide">${photosOf(data.topRated)[0]?`<img src="${escapeAttr(photosOf(data.topRated)[0])}" style="width:180px;height:180px;object-fit:cover;border-radius:20px;border:4px solid #fff;box-shadow:0 4px 0 #FFEAF1;"/>`:penguinSVG(120)}<h2>ความทรงจำสุดพิเศษ</h2><p style="font-weight:700;color:#8A5B68;">${escapeHtml(data.topRated.place)}</p>${heartsHtml(data.topRated.rating||0)}</div>` : '',
    `<div class="wrapped-slide">${penguinSVG(120)}<h2>${data.tripCount ? `${data.tripCount} ทริปด้วยกัน` : 'ขอบคุณนะ 🐧💕'}</h2><p>ขอบคุณที่เก็บความทรงจำไว้ด้วยกันนะ 🐧💕</p></div>`
  ].filter(Boolean);
  return `${navRow}<div class="wrapped-scroll">${slides.join('')}</div>
    <div class="sheet-actions"><button class="btn ghost closeWrappedBtn">ปิด</button></div>`;
}

function bindWrapped(year){
  const sheet = document.querySelector('.sheet');
  if(!sheet) return;
  sheet.querySelectorAll('.wrappedNav').forEach(btn=>{
    if(btn.disabled) return;
    btn.onclick = ()=>{
      const years = availableWrappedYears();
      const idx = years.indexOf(String(year));
      const newYear = btn.dataset.dir === 'prev' ? years[idx+1] : years[idx-1];
      openSheet = { type:'wrapped', year: newYear };
      renderSheet();
    };
  });
  const closeBtn = sheet.querySelector('.closeWrappedBtn');
  if(closeBtn) closeBtn.onclick = ()=>{ openSheet=null; renderSheet(); };
}

function parseGoogleMapsInput(text){
  if(!text) return null;
  text = text.trim();
  let m = text.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = text.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = text.match(/[?&](?:q|query)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = text.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  return null;
}

function bindAddForm(existing){
  let rating = existing ? (existing.rating||0) : 0;
  let keptPhotos = existing ? photosOf(existing).slice() : []; // already-uploaded URLs kept
  let removedPhotos = []; // already-uploaded URLs to delete from storage on save
  let newFiles = []; // File objects staged for upload on save

  function renderPhotoStrip(){
    const strip = document.getElementById('photoStrip');
    if(!strip) return;
    let html = '';
    keptPhotos.forEach((url, i)=>{
      html += `<div class="photo-chip"><img src="${escapeAttr(url)}"/><button type="button" class="rm" data-kind="kept" data-i="${i}">✕</button></div>`;
    });
    newFiles.forEach((file, i)=>{
      html += `<div class="photo-chip"><img src="${URL.createObjectURL(file)}"/><span class="pending">ใหม่</span><button type="button" class="rm" data-kind="new" data-i="${i}">✕</button></div>`;
    });
    strip.innerHTML = html;
    strip.querySelectorAll('.rm').forEach(btn=>{
      btn.onclick = ()=>{
        const i = Number(btn.dataset.i);
        if(btn.dataset.kind === 'kept'){ removedPhotos.push(keptPhotos[i]); keptPhotos.splice(i,1); }
        else{ newFiles.splice(i,1); }
        renderPhotoStrip();
      };
    });
  }
  renderPhotoStrip();
  let pinLat = existing && existing.lat!=null ? existing.lat : null;
  let pinLng = existing && existing.lng!=null ? existing.lng : null;
  let pinMap = null;
  let pinMarker = null;
  const pinIcon = L.divIcon({
    html: `<div style="width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #FF8FAE;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.2);">${penguinSVG(20)}</div>`,
    className: '', iconSize:[32,32], iconAnchor:[16,32]
  });
  function updatePinStatus(){
    const el = document.getElementById('pinStatus');
    if(el) el.textContent = 'ปักหมุดไว้แล้ว 🐧 แตะบนแผนที่เพื่อเปลี่ยนตำแหน่ง';
  }
  function placePin(lat, lng, recenter){
    pinLat = lat; pinLng = lng;
    if(!pinMap) return;
    if(pinMarker){ pinMarker.setLatLng([lat,lng]); }
    else{
      pinMarker = L.marker([lat,lng], { draggable:true, icon:pinIcon }).addTo(pinMap);
      pinMarker.on('dragend', ()=>{ const ll = pinMarker.getLatLng(); pinLat=ll.lat; pinLng=ll.lng; updatePinStatus(); });
    }
    if(recenter) pinMap.setView([lat,lng], 14);
    updatePinStatus();
  }
  requestAnimationFrame(()=>{
    const wrap = document.getElementById('pinMapWrap');
    if(!wrap) return;
    const center = (pinLat!=null && pinLng!=null) ? [pinLat, pinLng] : [13.7563, 100.5018];
    pinMap = L.map('pinMapWrap', { zoomControl:false, attributionControl:false }).setView(center, (pinLat!=null)?12:5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:19 }).addTo(pinMap);
    if(pinLat!=null && pinLng!=null){ placePin(pinLat, pinLng, false); }
    pinMap.on('click', (e)=>{ placePin(e.latlng.lat, e.latlng.lng, false); });
  });
  document.getElementById('useGeoLinkBtn').onclick = ()=>{
    const raw = document.getElementById('f_geolink').value;
    const coords = parseGoogleMapsInput(raw);
    if(!coords){ showToast('อ่านพิกัดไม่ได้ ลองวางลิงก์แบบเต็ม หรือพิกัดแบบ lat,lng'); return; }
    placePin(coords.lat, coords.lng, true);
    showToast('ปักหมุดจากพิกัดแล้ว 🐧');
  };
  const picker = document.getElementById('ratingPicker');
  picker.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      rating = Number(btn.dataset.v);
      picker.querySelectorAll('button').forEach(b=>b.classList.toggle('filled', Number(b.dataset.v)<=rating));
    };
  });
  document.getElementById('f_photo_file').onchange = async (e)=>{
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    newFiles = newFiles.concat(files);
    e.target.value = '';
    renderPhotoStrip();
    for(const f of files){
      const exif = await readExif(f);
      if(!exif) continue;
      const dateInput = document.getElementById('f_date');
      let filled = false;
      if(exif.date && dateInput && !dateInput.value){ dateInput.value = exif.date; filled = true; }
      if(exif.lat!=null && exif.lng!=null && pinLat==null){ placePin(exif.lat, exif.lng, true); filled = true; }
      if(filled){ showToast('ดึงวันที่/ตำแหน่งจากรูปให้แล้ว 🐧'); }
      break;
    }
  };
  document.getElementById('cancelBtn').onclick = ()=>{ openSheet=null; editingId=null; renderSheet(); };
  document.getElementById('saveBtn').onclick = async ()=>{
    const place = document.getElementById('f_place').value.trim();
    const date = document.getElementById('f_date').value;
    if(!place || !date){ showToast('กรอกสถานที่และวันที่ก่อนนะ'); return; }
    const story = document.getElementById('f_story').value.trim();
    const trip = document.getElementById('f_trip').value.trim();
    const saveBtn = document.getElementById('saveBtn');

    for(let i=0; i<newFiles.length; i++){
      saveBtn.textContent = `กำลังบีบอัดรูป ${i+1}/${newFiles.length}...`;
      const compressed = await compressImage(newFiles[i], 300*1024, 1600);
      saveBtn.textContent = `กำลังอัปโหลดรูป ${i+1}/${newFiles.length}...`;
      try{
        const url = await uploadPhoto(compressed);
        keptPhotos.push(url);
      }catch(e){
        showToast(`อัปโหลดรูปที่ ${i+1} ไม่สำเร็จ ลองใหม่อีกครั้ง`);
        saveBtn.textContent = 'บันทึก';
        return;
      }
    }
    removedPhotos.forEach(deleteStoragePhoto);
    const photos = keptPhotos;

    saveBtn.textContent = 'กำลังบันทึก...';
    let record;
    if(existing){
      const placeChanged = existing.place.trim().toLowerCase() !== place.trim().toLowerCase();
      Object.assign(existing, { place, date, photos, photoUrl: undefined, story, rating, trip });
      if(pinLat!=null && pinLng!=null){ existing.lat = pinLat; existing.lng = pinLng; }
      else if(placeChanged){ existing.lat = null; existing.lng = null; }
      record = existing;
    } else {
      record = { id: uid(), place, date, photos, story, rating, trip, lat: pinLat, lng: pinLng };
      memories.push(record);
    }
    if(record.lat == null || record.lng == null){ await ensureCoords(record); }
    await persist();
    openSheet=null; editingId=null;
    render();
    showToast('บันทึกความทรงจำแล้ว');
  };
}

      ${Object.entries(CARD_THEMES).map(([key,t])=>`<button type="button" class="theme-swatch" data-theme="${key}" title="${t.label}" style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,${t.bgFrom},${t.bgTo});border:2px solid ${cardTheme===key?'#8A5B68':'#fff'};box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer;padding:0;"></button>`).join('')}
    </div>
    <button type="button" class="btn ghost shareCardBtn" style="width:100%;margin-bottom:10px;">🖼️ สร้าง/แชร์การ์ด</button>
    <div class="sheet-actions">
      <button class="btn ghost closeBtn">ปิด</button>
      <button class="btn ghost editBtn">แก้ไข</button>
      <button class="btn danger deleteBtn">ลบ</button>
    </div>
  `;
}

function loadImageCORS(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function loadSvgImage(svgString){
  return new Promise((resolve, reject)=>{
    const svg64 = btoa(unescape(encodeURIComponent(svgString)));
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = `data:image/svg+xml;base64,${svg64}`;
  });
}
async function ensureFontLoaded(){
  try{
    await Promise.all([
      document.fonts.load('800 58px "M PLUS Rounded 1c"'),
      document.fonts.load('700 30px "M PLUS Rounded 1c"'),
      document.fonts.load('500 30px "M PLUS Rounded 1c"')
    ]);
    await document.fonts.ready;
  }catch(e){ /* falls back to default sans-serif if the web font can't load */ }
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function roundRectClip(ctx, x, y, w, h, r){
  ctx.save();
  roundRectPath(ctx, x, y, w, h, r);
  ctx.clip();
}
function drawCover(ctx, img, x, y, w, h){
  const ir = img.width/img.height, tr = w/h;
  let sw, sh, sx, sy;
  if(ir > tr){ sh = img.height; sw = sh*tr; sx = (img.width-sw)/2; sy=0; }
  else{ sw = img.width; sh = sw/tr; sx=0; sy=(img.height-sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function wrapTextChars(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const lines = [];
  let line = '';
  for(const ch of text){
    if(ch === '\n'){ lines.push(line); line=''; if(lines.length>=maxLines) break; continue; }
    const test = line + ch;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = ch; if(lines.length>=maxLines) break; }
    else line = test;
  }
  if(line && lines.length < maxLines) lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lineHeight));
}
function drawPill(ctx, x, y, text, bg, fg){
  const padX = 24, h = 56;
  const w = ctx.measureText(text).width + padX*2;
  ctx.fillStyle = bg;
  roundRectPath(ctx, x, y, w, h, h/2);
  ctx.fill();
  ctx.fillStyle = fg;
  const prevBaseline = ctx.textBaseline;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x+padX, y+h/2+2);
  ctx.textBaseline = prevBaseline;
  return w;
}

function shareOrDownloadCanvas(canvas, filename, title){
  return new Promise((resolve, reject)=>{
    canvas.toBlob(async (blob)=>{
      if(!blob){ reject(new Error('toBlob failed')); return; }
      try{
        const file = new File([blob], filename, { type:'image/png' });
        if(navigator.canShare && navigator.canShare({ files:[file] })){
          await navigator.share({ files:[file], title: title || 'เพนกวินไดอารี่', text:'จากเพนกวินไดอารี่ 🐧' });
          resolve();
          return;
        }
      }catch(e){ /* share cancelled or unsupported — fall through to download */ }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      resolve();
    }, 'image/png');
  });
}

function drawWashiTape(ctx, cx, cy, angle, w, h, color){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle*Math.PI/180);
  ctx.globalAlpha = 0.82;
  ctx.fillStyle = color;
  ctx.fillRect(-w/2, -h/2, w, h);
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#fff';
  for(let i=-w/2; i<w/2; i+=14){ ctx.fillRect(i, -h/2, 6, h); }
  ctx.restore();
}

function drawThemeDecor(ctx, W, H, theme){
  if(theme.deco === 'petals'){
    const petals = [[110,110],[970,150],[70,1240],[1000,1270],[520,60],[860,1300]];
    petals.forEach(([dx,dy])=>{
      ctx.save(); ctx.translate(dx,dy); ctx.rotate(Math.random()*Math.PI);
      ctx.fillStyle = 'rgba(217,123,150,0.5)';
      for(let i=0;i<5;i++){ ctx.rotate(Math.PI*2/5); ctx.beginPath(); ctx.ellipse(0,-10,7,14,0,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
  } else if(theme.deco === 'waves'){
    ctx.save();
    ctx.strokeStyle = 'rgba(62,143,168,0.35)'; ctx.lineWidth = 6;
    for(let row=0; row<3; row++){
      ctx.beginPath();
      const y = H-90+row*22;
      for(let x=0; x<=W; x+=40){ ctx.lineTo(x, y + Math.sin(x/60+row)*8); }
      ctx.stroke();
    }
    ctx.restore();
  } else {
    [[90,90,10,'#FFC2D1'],[980,130,7,'#B8E3F5'],[55,1230,9,'#FFD9E6'],[1010,1260,11,'#C9F0D8'],[540,60,6,'#FFC2D1']]
      .forEach(([dx,dy,r,c])=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(dx,dy,r,0,Math.PI*2); ctx.fill(); });
  }
}

async function generateShareCard(m, opts){
  opts = opts || {};
  await ensureFontLoaded();
  const theme = CARD_THEMES[cardTheme] || CARD_THEMES.classic;
  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const FONT = '"M PLUS Rounded 1c", sans-serif';

  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, theme.bgFrom); grad.addColorStop(0.5, theme.bgMid); grad.addColorStop(1, theme.bgTo);
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  drawThemeDecor(ctx, W, H, theme);

  ctx.save();
  ctx.strokeStyle = 'rgba(255,143,174,0.5)';
  ctx.lineWidth = 4;
  ctx.setLineDash([14,10]);
  roundRectPath(ctx, 28, 28, W-56, H-56, 40);
  ctx.stroke();
  ctx.restore();

  const photos = photosOf(m);
  let bottom = 150;
  let photoImg = null;
  if(!opts.skipPhoto && photos[0]){ try{ photoImg = await loadImageCORS(photos[0]); }catch(e){ /* no photo available for the card */ } }

  if(photoImg){
    const pw = 860, ph = 680, px = (W-pw)/2, py = 90;
    ctx.save();
    ctx.translate(px+pw/2, py+ph/2);
    ctx.rotate(-1.4*Math.PI/180);
    ctx.translate(-(px+pw/2), -(py+ph/2));
    ctx.shadowColor = 'rgba(90,60,70,0.22)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 16;
    ctx.fillStyle = '#fff';
    roundRectPath(ctx, px-18, py-18, pw+36, ph+90, 26);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    roundRectClip(ctx, px, py, pw, ph, 16);
    drawCover(ctx, photoImg, px, py, pw, ph);
    ctx.restore();
    drawWashiTape(ctx, px+90, py-14, -9, 140, 50, theme.accent);
    drawWashiTape(ctx, px+pw-90, py-10, 8, 140, 50, theme.accent2);
    ctx.restore();
    bottom = py + ph + 130;
  } else {
    try{
      const pg = await loadSvgImage(penguinSVG(320, {heart:true}));
      const pw = 300, ph = 330;
      ctx.drawImage(pg, (W-pw)/2, 120, pw, ph);
      bottom = 120 + ph + 60;
    }catch(e){ console.warn('penguin illustration failed to draw', e); }
  }

  ctx.fillStyle = theme.accent2;
  ctx.font = `800 58px ${FONT}`;
  ctx.fillText(m.place || '', 70, bottom);
  bottom += 46;

  ctx.font = `700 28px ${FONT}`;
  const dateLabel = fmtDate(m.date);
  const w1 = drawPill(ctx, 70, bottom, dateLabel, theme.pillBg, theme.pillFg);
  if(m.trip){ drawPill(ctx, 70+w1+16, bottom, `🧳 ${m.trip}`, theme.pillBg, theme.pillFg); }
  bottom += 56 + 44;

  if(m.rating){
    ctx.fillStyle = '#FF6F91';
    ctx.font = '40px sans-serif';
    ctx.fillText('♥'.repeat(m.rating), 70, bottom);
    bottom += 50;
  }

  if(m.story){
    ctx.fillStyle = '#5B4A4E';
    ctx.font = `500 30px ${FONT}`;
    wrapTextChars(ctx, m.story, 70, bottom, W-140, 46, 5);
  }

  try{
    const mascot = await loadSvgImage(penguinSVG(200));
    const mw = 150, mh = 165;
    ctx.drawImage(mascot, W-mw-44, H-mh-40, mw, mh);
  }catch(e){ console.warn('mascot signature failed to draw', e); }
  ctx.font = `700 26px ${FONT}`;
  ctx.fillStyle = theme.pillFg;
  ctx.textAlign = 'right';
  ctx.fillText('เพนกวินไดอารี่ 🐧', W-104, H-90);
  ctx.textAlign = 'left';

  return shareOrDownloadCanvas(canvas, `${(m.place||'memory').replace(/[^\w\u0E00-\u0E7F]+/g,'_')}.png`, m.place);
}

async function generateTripShareCard(tripName, items, opts){
  opts = opts || {};
  await ensureFontLoaded();
  const theme = CARD_THEMES[cardTheme] || CARD_THEMES.classic;
  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const FONT = '"M PLUS Rounded 1c", sans-serif';

  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, theme.bgFrom); grad.addColorStop(0.5, theme.bgMid); grad.addColorStop(1, theme.bgTo);
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  drawThemeDecor(ctx, W, H, theme);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,143,174,0.5)'; ctx.lineWidth = 4; ctx.setLineDash([14,10]);
  roundRectPath(ctx, 28, 28, W-56, H-56, 40); ctx.stroke();
  ctx.restore();

  ctx.fillStyle = theme.accent2;
  ctx.font = `800 54px ${FONT}`;
  ctx.fillText(`🧳 ${tripName}`, 70, 120);

  const dates = items.map(x=>x.date).filter(Boolean).sort();
  const dateRange = dates.length ? (dates[0]===dates[dates.length-1] ? fmtDate(dates[0]) : `${fmtDate(dates[0])} - ${fmtDate(dates[dates.length-1])}`) : '';
  const placesCount = new Set(items.map(x=>(x.place||'').trim().toLowerCase())).size;
  ctx.font = `700 26px ${FONT}`;
  const pw1 = drawPill(ctx, 70, 150, dateRange, theme.pillBg, theme.pillFg);
  drawPill(ctx, 70+pw1+16, 150, `${items.length} เรื่องราว • ${placesCount} ที่`, theme.pillBg, theme.pillFg);

  const photosFlat = [];
  if(!opts.skipPhotos){ items.forEach(x=>{ const p = photosOf(x)[0]; if(p) photosFlat.push(p); }); }
  const gridPhotos = photosFlat.slice(0,6);
  const gx=70, gy=250, gw=W-140, gh=760, gap=14;
  if(gridPhotos.length){
    const cols = gridPhotos.length<=2 ? gridPhotos.length : (gridPhotos.length<=4 ? 2 : 3);
    const rows = Math.ceil(gridPhotos.length/cols);
    const cellW=(gw-gap*(cols-1))/cols, cellH=(gh-gap*(rows-1))/rows;
    for(let i=0;i<gridPhotos.length;i++){
      const col=i%cols, row=Math.floor(i/cols);
      const cx=gx+col*(cellW+gap), cy=gy+row*(cellH+gap);
      try{
        const img = await loadImageCORS(gridPhotos[i]);
        roundRectClip(ctx,cx,cy,cellW,cellH,18);
        drawCover(ctx,img,cx,cy,cellW,cellH);
        ctx.restore();
      }catch(e){ ctx.fillStyle='#fff'; roundRectPath(ctx,cx,cy,cellW,cellH,18); ctx.fill(); }
    }
  } else {
    try{
      const pg = await loadSvgImage(penguinSVG(300, {heart:true}));
      ctx.drawImage(pg, (W-280)/2, gy + (gh-308)/2, 280, 308);
    }catch(e){ console.warn('penguin illustration failed to draw', e); }
  }

  try{
    const mascot = await loadSvgImage(penguinSVG(200));
    ctx.drawImage(mascot, W-190, H-205, 150, 165);
  }catch(e){ console.warn('mascot signature failed to draw', e); }
  ctx.textAlign = 'right';
  ctx.font = `700 26px ${FONT}`;
  ctx.fillStyle = theme.pillFg;
  ctx.fillText('เพนกวินไดอารี่ 🐧', W-104, H-90);
  ctx.textAlign = 'left';

  return shareOrDownloadCanvas(canvas, `${tripName.replace(/[^\w\u0E00-\u0E7F]+/g,'_')}_trip.png`, tripName);
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = ()=>{ tab = btn.dataset.tab; searchTerm=''; render(); };
});
document.getElementById('fabAdd').onclick = ()=>{ editingId=null; openSheet='add'; renderSheet(); };

  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline caching just won't be available */ });
  });
}

load();
